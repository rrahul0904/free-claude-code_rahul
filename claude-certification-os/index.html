<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Claude Certification OS</title>
  <meta name="description" content="Claude Certification OS for all four Claude certification tracks." />
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f7f7f5;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #status{position:fixed;inset:0;display:grid;place-items:center;color:#525252;background:#f7f7f5;font-size:15px}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#f7f7f5}
  </style>
</head>
<body>
  <div id="status">Loading Claude Certification OS…</div>
  <iframe id="app" title="Claude Certification OS"></iframe>
  <script>
    (async()=>{
      const source='https://cikxzxxreryycfjumwsd.supabase.co/functions/v1/claude-certification-os';
      const status=document.getElementById('status');
      const app=document.getElementById('app');
      try{
        const r=await fetch(source,{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const svg=await r.text();
        if(!svg.includes('<svg')) throw new Error('Invalid app payload');
        const blob=new Blob([svg],{type:'image/svg+xml'});
        const url=URL.createObjectURL(blob);
        app.onload=()=>{status.style.display='none';app.style.display='block'};
        app.src=url;
      }catch(e){
        status.textContent='Claude Certification OS could not load: '+e.message;
      }
    })();
  </script>
</body>
</html>
